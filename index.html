<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>

<button id="dark">Dark & Light</button>
    
    <div class="container">
        <h2>◑﹏◐ ,,,,, Translate</h2>
        <div class="translation-box">
            <textarea id="inputText" placeholder="Mantni kiriting..."></textarea>
            <div class="contarols">
                <select id="inputLang"></select>
                <button class="speak-btn" data-target="inputText">🔊</button>
            </div>
        </div>

        <div class="translation-box">
            <textarea id="outputText" placeholder="Mantni kiriting..."></textarea>
            <div class="contarols">
                <select id="outputLang"></select>
                <button class="speak-btn" data-target="outputText">🔊</button>
            </div>
        </div>

        <button id="translateBtn" class="translateBtn">Tajrima qilish</button>
    </div>


    <script src="./script.js"></script>
</body>

</html>
